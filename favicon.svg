<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD166;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="100" height="100" rx="18" fill="url(#bgGrad)"/>
  
  <!-- Art palette icon -->
  <circle cx="50" cy="35" r="18" fill="white" opacity="0.9"/>
  <circle cx="45" cy="30" r="3" fill="#FF6B6B"/>
  <circle cx="55" cy="30" r="3" fill="#4ECDC4"/>
  <circle cx="50" cy="40" r="3" fill="#FFD166"/>
  
  <!-- Brush stroke below -->
  <path d="M 30 60 Q 50 55, 70 60" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
